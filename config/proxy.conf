# ──────────────────────────────────────────────
# Proxy Server Configuration
# ──────────────────────────────────────────────

[server]
listen_host = 0.0.0.0
listen_port = 8888

# Maximum backlog for socket.listen()
max_connections = 50

# Thread pool size for handling concurrent clients.
# Each client connection occupies one thread from this pool.
# Requests arriving when the pool is saturated receive 503.
thread_pool_size = 20

[logging]
# Relative to src/ directory
log_file = logs/proxy.log

# Maximum log file size in bytes before rotation (1 MB)
max_log_size = 1048576

# Number of rotated backup files to keep
backup_count = 5

# Minimum log level: DEBUG, INFO, WARNING, ERROR
log_level = INFO

[cache]
enabled = true

# Maximum number of cached responses
max_entries = 100

# Maximum cacheable response size in bytes (512 KB)
max_object_size = 524288

# Time-to-live for cached entries in seconds (5 minutes)
cache_ttl = 300

[rate_limit]
enabled = true

# Maximum burst capacity (tokens per bucket)
capacity = 20

# Token refill rate (tokens per second)
refill_rate = 2

[dashboard]
enabled = true
port = 8889
